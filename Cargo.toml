[package]
name = "gcm"
version = "0.1.0"
edition = "2021"
authors = ["Chris Mannina"]
description = "Generate intelligent git commit messages using LLMs"
license = "MIT"

[dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"

# Git operations
git2 = "0.18"

# HTTP client for LLM APIs
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.35", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Configuration
dirs = "5.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Environment variables
dotenv = "0.15"

# Async runtime
async-trait = "0.1"

[[bin]]
name = "gcm"
path = "src/main.rs"